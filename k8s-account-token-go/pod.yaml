apiVersion: v1
kind: Namespace
metadata:
  name: api1
---
apiVersion: v1
kind: Namespace
metadata:
  name: api2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api1
  namespace: api1
  labels:
    app: api1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api1
  template:
    metadata:
      labels:
        app: api1
    spec:
      serviceAccountName: default
      containers:
        - name: api1
          image: test:latest
          imagePullPolicy: Never
          args: ["api1"]
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api2
  namespace: api2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2
  namespace: api2
  labels:
    app: api2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      serviceAccountName: api2
      containers:
        - name: api2
          image: test:latest
          imagePullPolicy: Never
          args: ["api2"]
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api2
  namespace: api2
spec:
  selector:
    app: api2
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-token-creator
  namespace: api1
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["default"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api2-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api2-token-reviewer
subjects:
  - kind: ServiceAccount
    name: api2
    namespace: api2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api2-token-reviewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-token-creator
  namespace: api1
subjects:
  - kind: ServiceAccount
    name: default
    namespace: api1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: default-token-creator
